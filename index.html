<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Tiny Japanese Practice Tool</title>
    <!-- taglineJa: keep in sync with src/content/learner-copy.ts. The build rewrites title, description, and canonical per route. -->
    <meta name="description" content="Master kanji readings and verb conjugations. JLPT N5–N1, no signup, no fluff. 一緒に日本語、上手になろう！">
    <link rel="canonical" href="https://thetinywisdom.github.io/thetinyjapanese/">
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored ? stored === 'dark' : false;
          if (dark) document.documentElement.classList.add('dark');
        } catch (_) {}
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Tiny Japanese Practice Tool">
    <meta property="og:description" content="Master kanji readings and verb conjugations. JLPT N5–N1, no signup, no fluff. 一緒に日本語、上手になろう！">
    <meta property="og:url" content="https://thetinywisdom.github.io/thetinyjapanese/">
    <meta property="og:image" content="%BASE_URL%og.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Tiny Japanese Practice Tool">
    <meta name="twitter:description" content="Master kanji readings and verb conjugations. JLPT N5–N1, no signup, no fluff. 一緒に日本語、上手になろう！">
    <meta name="twitter:image" content="%BASE_URL%og.png">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
